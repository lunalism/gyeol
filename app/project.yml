# Gyeol.app shell — M1. Generated project: run `xcodegen` in this directory.
# Two targets on purpose: Gyeol (links WhisperKit) and GyeolBare (does not),
# so the bundle-size delta and nested-binary inventory can be diffed.
name: Gyeol
options:
  bundleIdPrefix: dev.gyeol
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  GyeolCore:
    path: ../
  Playback:
    path: Playback
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.0.0
targets:
  Gyeol:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/WhisperKitLink
    dependencies:
      - package: GyeolCore
        product: GyeolCore
      - package: argmax-oss-swift
        product: WhisperKit
      - package: Playback
        product: GyeolPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gyeol.Gyeol
        SWIFT_VERSION: "6.0"
    # Document type registration (M1 finalization): .gyeol is a package
    # UTI owned by us; NSDocumentClass wires NSDocumentController to the
    # M1.3 adapter.
    info:
      path: GeneratedInfo.plist
      properties:
        CFBundleDocumentTypes:
          - CFBundleTypeName: Gyeol Project
            CFBundleTypeRole: Editor
            LSItemContentTypes: [&gyeolUTI dev.gyeol.project]  # D25: single YAML anchor
            LSTypeIsPackage: true
            NSDocumentClass: Gyeol.GyeolDocumentFile
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: *gyeolUTI
            UTTypeDescription: Gyeol Project
            UTTypeConformsTo: [com.apple.package]
            UTTypeTagSpecification:
              public.filename-extension: [gyeol]
    scheme:
      testTargets: [GyeolAppTests]
  # Standalone test bundle (no TEST_HOST): the files under test are compiled
  # directly into the bundle, so the tests run headlessly via xcodebuild.
  GyeolAppTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests
      - path: Sources/App/GyeolDocumentFile.swift
      - path: Sources/App/MediaResolver.swift
      - path: Sources/App/PlaybackController.swift
      - path: Sources/App/DocumentView.swift
      - path: Sources/App/PlayerLayerView.swift
      - path: Sources/App/Timeline/TimelineViewport.swift
      - path: Sources/App/Timeline/WaveformStore.swift
      - path: Sources/App/Timeline/TimelineRenderer.swift
      - path: Sources/App/Timeline/TimelineMetalView.swift
      - path: Sources/App/Timeline/TimelineHostView.swift
    dependencies:
      - package: GyeolCore
        product: GyeolCore
      - package: Playback
        product: GyeolPlayback
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gyeol.GyeolAppTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  GyeolBare:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - package: GyeolCore
        product: GyeolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gyeol.GyeolBare
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
