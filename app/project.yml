# Gyeol.app shell — M1. Generated project: run `xcodegen` in this directory.
# Two targets on purpose: Gyeol (links WhisperKit) and GyeolBare (does not),
# so the bundle-size delta and nested-binary inventory can be diffed.
name: Gyeol
options:
  bundleIdPrefix: dev.gyeol
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  GyeolCore:
    path: ../
  argmax-oss-swift:
    url: https://github.com/argmaxinc/argmax-oss-swift
    exactVersion: 1.0.0
targets:
  Gyeol:
    type: application
    platform: macOS
    sources:
      - Sources/App
      - Sources/WhisperKitLink
    dependencies:
      - package: GyeolCore
        product: GyeolCore
      - package: argmax-oss-swift
        product: WhisperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gyeol.Gyeol
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  GyeolBare:
    type: application
    platform: macOS
    sources:
      - Sources/App
    dependencies:
      - package: GyeolCore
        product: GyeolCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.gyeol.GyeolBare
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
